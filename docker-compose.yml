services:

  postgres:
    image: postgres:17
    container_name: realestate-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: realestate
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d realestate"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:8
    container_name: realestate-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: realestate-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - media_data:/app/media

    ports:
      - "8000:8000"

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py seed_demo_data &&
      python manage.py runserver 0.0.0.0:8000
      "


  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: realestate-celery
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - media_data:/app/media

    command: celery -A backend worker --loglevel=info


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: realestate-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:3000"


volumes:
  postgres_data:
  media_data: